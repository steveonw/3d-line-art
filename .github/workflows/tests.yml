name: Phase tests

on:
  push:
    branches:
      - "phase-*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Install Chromium for browser regressions
        run: python -m playwright install --with-deps chromium

      - name: Generate reference fixtures
        run: python scripts/make_reference_fixtures.py

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/geometry_builder.js
          node --check frontend/control_dock.js
          node --check frontend/ink3d.js
          node --check frontend/inspection_viewer.js
          node --check frontend/analysis_maps.js
          node --check frontend/multiview.js
          node --check frontend/random_field.js
          node --check frontend/procedural_flow.js
          node --check frontend/math_fields.js
          node --check frontend/stroke_placement.js
          node --check frontend/project_state.js
          node --check frontend/history.js
          node --check frontend/line_renderer.js
          node --check frontend/export.js
          node --check frontend/lidar_client.js
          node --check frontend/app.js

      - name: Run frontend LiDAR smoke test
        run: node tests/frontend_maps_smoke.js

      - name: Run LiDAR art polish renderer smoke test
        run: node tests/frontend_lidar_polish_smoke.js

      - name: Run LiDAR mask chord smoke test
        run: node tests/frontend_lidar_mask_chord_smoke.js

      - name: Run geometry builder smoke test
        run: node tests/frontend_geometry_builder_smoke.js

      - name: Run Control Dock smoke test
        run: node tests/frontend_control_dock_smoke.js

      - name: Run 3D Ink smoke test
        run: node tests/frontend_ink3d_smoke.js

      - name: Run 3D inspection viewer smoke test
        run: node tests/frontend_inspection_viewer_smoke.js

      - name: Run confidence fusion smoke test
        run: node tests/frontend_confidence_fusion_smoke.js

      - name: Run fixed multi-view smoke test
        run: node tests/frontend_multiview_smoke.js

      - name: Run multi-view debug renderer smoke test
        run: node tests/frontend_multiview_renderer_smoke.js

      - name: Run stable randomness smoke test
        run: node tests/frontend_randomness_smoke.js

      - name: Run procedural flow smoke test
        run: node tests/frontend_procedural_flow_smoke.js

      - name: Run mathematical flow mixer smoke test
        run: node tests/frontend_math_fields_smoke.js

      - name: Run stroke placement smoke test
        run: node tests/frontend_stroke_placement_smoke.js

      - name: Run history autosave smoke test
        run: node tests/frontend_history_smoke.js

      - name: Run portable project smoke test
        run: node tests/frontend_project_file_smoke.js

      - name: Run Python and real-browser tests
        run: python -m unittest discover -s tests -v
